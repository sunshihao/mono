packages:
    - "apps/*"
    - "packages/*"

# 依赖构建脚本白名单。pnpm 10 起该设置从 package.json 的 pnpm 字段迁到此处
# （留在 package.json 会被忽略并每次告警）。
#
# 注意 tree-sitter **有意不在列**：它是 @llamaindex/node-parser 的 peer 依赖（经
# llamaindex 传递进来），本仓没有任何代码引用它；其 postinstall 会跑 node-gyp rebuild，
# 而 node:22-alpine 没有 python/make/g++，会导致容器内 pnpm install 直接失败
# （docker 构建实测：tree-sitter install → gyp ERR! not ok → ELIFECYCLE exit 1）。
# 本机（macOS）同样没有编译出 binding，api 一直工作正常，说明运行期确不需要。
onlyBuiltDependencies:
    - esbuild
    - protobufjs
